name: Validate marketplace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run check
      - run: bun test
      - name: Validate Claude marketplace and plugin with the pinned official client
        run: |
          bunx @anthropic-ai/claude-code@2.1.266 plugin validate . --strict
          bunx @anthropic-ai/claude-code@2.1.266 plugin validate ./claude/plugins/vetintel --strict
